# XcodeGen project definition. Regenerate the .xcodeproj with:  xcodegen generate
# Change identifiers here, never in the generated project.
name: RiseAndShine

options:
  bundleIdPrefix: com.lomaco
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 26 "approachable concurrency": UI code is main-actor by default.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer team id here (or select it once in Xcode › Signing).
    DEVELOPMENT_TEAM: "QQB33452MG"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  RiseCore:
    path: Packages/RiseCore

targets:
  RiseAndShine:
    type: application
    platform: iOS
    sources:
      - path: RiseAndShine
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RiseCore
      - target: RiseAndShineWidgets
      - target: RiseAndShineWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lomaco.riseandshine
        # Deliberately NOT "Rise and Shine": PRODUCT_NAME sets the .app bundle and binary
        # name, and a space there breaks the generated TEST_HOST path (it assumes the
        # target name), so the unit-test target cannot launch. The name users actually
        # see on the Home screen is CFBundleDisplayName below.
        PRODUCT_NAME: RiseAndShine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Xcode fills Localizable.xcstrings from SwiftUI string literals on each build.
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: RiseAndShine/Info.plist
      properties:
        CFBundleDisplayName: Rise and Shine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSAlarmKitUsageDescription: Rise and Shine schedules your sunrise alarm so it rings even in Silent mode or a Focus.
        NSLocationWhenInUseUsageDescription: Your location is used only to calculate local sunrise and sunset times, on your device.
        NSHealthShareUsageDescription: Optional. Reads the sleep your Apple Watch or another app recorded, to compare last night with your sleep goal. Nothing is written to Health.
        NSCalendarsFullAccessUsageDescription: Optional. Adds a "Sleep" event from bedtime to your alarm in its own calendar, and keeps it up to date as sunrise moves.
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.lomaco.riseandshine.refresh]
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.lomaco.riseandshine
            CFBundleURLSchemes: [riseandshine]
    entitlements:
      path: RiseAndShine/RiseAndShine.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lomaco.riseandshine]
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # iCloud key-value store: settings follow the user to a new phone. Restore for
        # release alongside time-sensitive below; personal teams cannot sign it, and without
        # it CloudSettings simply never syncs.
        # com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        # Restore for release. Apple does not issue this capability to free/personal
        # teams, so signing fails on one; without it reminders cannot break a Focus.
        # com.apple.developer.usernotifications.time-sensitive: true

  RiseAndShineWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RiseAndShineWidgets
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: RiseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lomaco.riseandshine.widgets
        PRODUCT_NAME: RiseAndShineWidgets
        SKIP_INSTALL: YES
        # Lets files in Shared/ leave out app-only code (AppModel, AlarmKit scheduling).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
    info:
      path: RiseAndShineWidgets/Info.plist
      properties:
        CFBundleDisplayName: Rise and Shine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RiseAndShineWidgets/RiseAndShineWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lomaco.riseandshine]

  # Apple Watch companion app. Computes its own plan with RiseCore from settings the phone
  # mirrors over WatchConnectivity, so it works on the wrist without the phone nearby.
  RiseAndShineWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/App
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
        excludes: ["SunriseAlarmMetadata.swift", "WidgetIntents.swift"]
    dependencies:
      - package: RiseCore
      - target: RiseAndShineWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lomaco.riseandshine.watchkitapp
        PRODUCT_NAME: RiseAndShineWatch
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.lomaco.riseandshine
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WATCH_APP"
    info:
      path: Watch/App/Info.plist
      properties:
        CFBundleDisplayName: Rise and Shine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Required, or installd rejects the *iPhone* app with "InvalidWatchKitApp".
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lomaco.riseandshine
        WKRunsIndependentlyOfCompanionApp: true
    entitlements:
      path: Watch/App/RiseAndShineWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lomaco.riseandshine]

  RiseAndShineWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Watch/Widgets
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
        excludes: ["SunriseAlarmMetadata.swift", "WidgetIntents.swift"]
    dependencies:
      - package: RiseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lomaco.riseandshine.watchkitapp.widgets
        PRODUCT_NAME: RiseAndShineWatchWidgets
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WATCH_APP WIDGET_EXTENSION"
    info:
      path: Watch/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Rise and Shine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Watch/Widgets/RiseAndShineWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lomaco.riseandshine]

  RiseAndShineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RiseAndShineTests
    dependencies:
      - target: RiseAndShine
      - package: RiseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lomaco.riseandshine.tests
        # The test bundle has no Info.plist of its own in the repo; let Xcode synthesise
        # one, otherwise code signing the bundle fails.
        GENERATE_INFOPLIST_FILE: YES

  # Drives the real app on a real device: the checks that need taps and cannot be
  # covered by RiseCore's logic tests (AlarmKit has no simulator support).
  RiseAndShineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RiseAndShineUITests
    dependencies:
      - target: RiseAndShine
      - package: RiseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lomaco.riseandshine.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RiseAndShine
        # XCTestCase's initialisers are nonisolated, so the project-wide MainActor
        # default cannot apply to its subclasses. Test methods are marked @MainActor
        # individually instead.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  RiseAndShine:
    build:
      targets:
        RiseAndShine: all
        RiseAndShineWidgets: all
        RiseAndShineWatch: all
        RiseAndShineWatchWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RiseAndShineTests
        - RiseAndShineUITests
        - package: RiseCore/RiseCoreTests
    archive:
      config: Release

  # Builds the watch app on its own, for compile checks and for running on a paired watch.
  RiseAndShineWatch:
    build:
      targets:
        RiseAndShineWatch: all
        RiseAndShineWatchWidgets: all
    run:
      config: Debug
