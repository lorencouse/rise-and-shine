name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  risecore:
    name: RiseCore tests
    # RiseCore's Package.swift needs swift-tools 6.2, which ships with Xcode 26.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        working-directory: Packages/RiseCore
        run: swift test

  app:
    name: App build (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      # Simulator destination and a private DerivedData: an unsigned generic/platform=iOS
      # build would be reused by later device test runs (see TODO.md notes).
      - name: Build
        run: |
          xcodebuild build \
            -project RiseAndShine.xcodeproj \
            -scheme RiseAndShine \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
